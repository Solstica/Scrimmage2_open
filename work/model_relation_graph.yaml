version: '1.0'
status: REVIEWED
paper_route_zh: 复色散双光束正模型到双角度联合反演，再到Neumann/Airy多光束诊断与回溯修正
abstract_route_consistent: true
nodes:
  Q1:
    model_name_zh: 复色散双光束Fresnel测厚模型
    question_type: inverse_forward_model
    inputs: [波数, 入射角, 外延层与衬底光学参数]
    outputs: [双光束复反射率正算子, 相位厚度关系]
    assumptions: [层状均匀介质, 界面平行, 第一束内部反射]
  Q2:
    model_name_zh: 双角度共享参数复反射率联合反演
    question_type: parameter_inverse_problem
    inputs: [Q1正算子, 附件1, 附件2, 波段与预处理规则]
    outputs: [SiC厚度候选, 参数可辨识性, 残差与不确定性]
    assumptions: [同片共享厚度与材料参数, 角度已知, 波段模型适配]
  Q3:
    model_name_zh: 第三束光强判据驱动的双光束—Airy条件反演模型
    question_type: inverse_model_selection
    inputs: [Q1双光束Fresnel界面系数, Q2冻结参数与厚度, 附件1至4]
    outputs: [第三束光强比, 条件选择的唯一主模型, Si厚度, SiC回溯结论]
    assumptions: [界面平行且光谱相干, 实折射角近似, 同片双角度厚度一致]
edges:
- from: Q1
  to: Q2
  relation: extend
  inherited:
    symbols: [sigma, theta_0, d, n_tilde, r_ij]
    equations: [Snell复角关系, s_p偏振Fresnel系数, 双光束复反射率正算子]
    assumptions: [层状均匀介质, 界面平行, 非偏振平均]
    code_modules: [shared/code/optics.py, shared/code/materials.py]
    result_ids: []
  changed:
    added: [附件1和附件2, 共享厚度约束, 角度独立仿射标定, 有界联合反演]
    modified: [解析正算改为数据驱动反问题]
    removed: []
  reason_zh: Q2直接调用Q1双光束复反射率核，并增加数据预处理、共享参数和反演算法
- from: Q2
  to: Q3
  relation: extend
  inherited:
    symbols: [sigma, theta_0, d, n_tilde, r_ij]
    equations: [双光束复反射率正算子, 双角度共享参数目标函数]
    assumptions: [同片共享厚度与材料参数, 非偏振平均]
    code_modules: [shared/code/optics.py, shared/code/inversion.py]
    result_ids: [R-Q2-D]
  changed:
    added: [第三束相对表面反射光强比, 0.1%条件分支, Airy无穷多束闭式, 附件3和附件4]
    modified: [折射角由复折射率实部计算, Si按角度独立反演后取均值, 联合反演降为验证]
    removed: [Neumann有限阶比较, AIC选择, 角度经验增益和偏置]
  reason_zh: Q3先用第三束光强比判定双光束近似是否足够；SiC只回溯验证R-Q2-D，只有判据超过阈值才触发Q2结果STALE和重新反演
shared_symbols:
- {symbol: sigma, meaning_zh: 真空波数, unit: cm^-1}
- {symbol: d, meaning_zh: 外延层厚度, unit: um}
- {symbol: theta_0, meaning_zh: 空气侧入射角, unit: degree}
- {symbol: n_tilde, meaning_zh: 复折射率, unit: '1'}
- {symbol: r_ij, meaning_zh: 介质i到j界面复振幅反射系数, unit: '1'}
- {symbol: eta_3, meaning_zh: 第三束内部反射光与表面反射光的强度比, unit: '1'}
review:
  all_questions_connected_or_independent: true
  no_unexplained_redefinition: true
  route_matches_abstract: true
