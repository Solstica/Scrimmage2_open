version: 3.4.0-rc1
overview:
  research_problem: 研究红外干涉光谱反演碳化硅与硅外延层厚度的问题
  overall_route: 以复Fresnel正算子贯通双角度联合反演与Neumann/Airy多光束判别
questions:
- question_id: Q1
  central_sentence: 针对问题一，建立复色散双光束Fresnel测厚模型
  preliminary_work: 统一复介电函数、被动平方根分支、s/p偏振和微米到厘米缩放
  model: 由复Snell关系和两界面Fresnel系数叠加表面束与第一束内部反射
  algorithm: 采用解析推导、极限情形和合成光谱直接恢复进行求解检验
  result: 合成厚度绝对误差为 0.00046 μm
  result_ids: [R-Q1-SYNTHETIC]
  analysis: 零厚度退化和Neumann极限均通过，四联检查最大复数误差为1.25×10^-14
- question_id: Q2
  central_sentence: 针对问题二，建立双角度共享参数复反射率联合反演
  preliminary_work: 审查共同边界异常点并由波段比较选择2000至3900波数带
  model: 同片双角度共享厚度与材料参数，各角度标定通过仿射剖面消元
  algorithm: 采用三种子差分进化粗搜、鲁棒最小二乘精修、SVD和移动块Bootstrap
  result: SiC外延层厚度为 7.3840 μm；块Bootstrap的2.5%—97.5%分位范围为 7.3747—7.3943 μm
  result_ids: [R-Q2-D, R-Q2-BOOT]
  analysis: 折射率尺度与厚度相关系数0.9996，故另报告7.2381至7.5359微米的系统范围
- question_id: Q3
  central_sentence: 针对问题三，建立第三束光强判据驱动的双光束—Airy条件反演模型
  preliminary_work: 统一实折射角近似、第三束光强比口径和问题二冻结结果接口
  model: 在完整指定波段计算第三束相对表面反射光强比，以0.1%阈值唯一选择双光束或Airy模型
  algorithm: 采用确定性多启动有界最小二乘分别反演两角度厚度，并以双角度联合拟合、边界和Jacobian诊断验证
  result: Si最大第三束光强比为0.00292%，故采用双光束模型，Si外延层厚度为3.3087 μm；SiC保留问题二厚度7.3840 μm
  result_ids: [R-Q3-SIC-DELTA, R-Q3-SI-D, R-Q3-SI-REDUCTION]
  analysis: 两角度厚度相对差为3.37%，联合验证相差2.27%；载流子浓度和碰撞参数不可辨识，故不作材料解释
innovation:
- 以第三束光强比条件分支裁决两篇参考论文对多光束修正的冲突
- 将统计误差与折射率材料常数造成的系统误差分层报告
keywords:
  research_problem: [外延层厚度反演]
  specific_models: [复Fresnel联合反演, 第三束光强条件反演模型]
  algorithms: [差分进化, 移动块Bootstrap]
